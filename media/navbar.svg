  <text x="480" y="97" class="sub" font-size="15" font-weight="400">Watch</text>
  <text x="576" y="97" class="ink" font-size="15" font-weight="600">Learn</text>
  <circle cx="564" cy="92" r="3.5" fill="#f04e2e"/>
  <text x="672" y="97" class="sub" font-size="15" font-weight="400">Build</text>
  <rect x="1000" y="76" width="118" height="34" rx="17" fill="#f04e2e"/>
