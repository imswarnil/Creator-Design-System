  <rect x="40" y="56" width="1120" height="112" rx="20" class="fill-surface"/>
  <path d="M60 56h1080a20 20 0 0 1 20 20v76a20 20 0 0 1-20 20H60a20 20 0 0 1-20-20V76a20 20 0 0 1 20-20Z" fill="none" class="hair"/>
  <path d="M60 56h380" stroke="#f04e2e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="72" y="98" class="ink" font-size="22" font-weight="700" letter-spacing="-0.8">creator</text>
