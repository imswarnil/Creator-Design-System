<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img">
  <style>
    .bg      { fill: #fff; }
    .surface { fill: #f8f8fa; }
    .hair    { stroke: #e5e5ea; fill: none; stroke-width: 1; }
    .hair2   { stroke: #f1f1f4; fill: none; stroke-width: 1; }
    .ink     { fill: #191922; }
    .sub     { fill: #76768a; }
    .faint   { fill: #a5a5b2; }
    .fill-surface { fill: #f8f8fa; }
    .fill-line    { fill: #e5e5ea; }
    .accent  { fill: #f04e2e; }
    .on-accent { fill: #fff; }
    text { font-family: system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
    .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .slate { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing: 2.5px; }
    @media (prefers-color-scheme: dark) {
      .bg      { fill: #08080c; }
      .surface { fill: #101017; }
      .hair    { stroke: #2a2a35; }
      .hair2   { stroke: #1c1c26; }
      .ink     { fill: #f8f8fa; }
      .sub     { fill: #a5a5b2; }
      .faint   { fill: #76768a; }
      .fill-surface { fill: #16161f; }
      .fill-line    { fill: #2a2a35; }
    }
  </style>
  <rect width="1200" height="320" class="bg"/>
  <text x="40" y="44" class="slate faint" font-size="11">SPACING — ONE LADDER, NO IMPROVISED GAPS</text>
  <rect x="40" y="64" width="4" height="44" rx="2" class="accent" fill-opacity="0.85"/>
