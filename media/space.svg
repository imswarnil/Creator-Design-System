  <text x="90" y="140" class="mono faint" font-size="9">8</text>
  <rect x="144" y="64" width="12" height="44" rx="2" class="accent" fill-opacity="0.85"/>
  <text x="144" y="126" class="mono faint" font-size="10">3</text>
  <text x="144" y="140" class="mono faint" font-size="9">12</text>
  <rect x="202" y="64" width="16" height="44" rx="2" class="accent" fill-opacity="0.85"/>
  <text x="202" y="126" class="mono faint" font-size="10">4</text>
  <text x="202" y="140" class="mono faint" font-size="9">16</text>
  <rect x="264" y="64" width="20" height="44" rx="2" class="accent" fill-opacity="0.85"/>
  <text x="264" y="126" class="mono faint" font-size="10">5</text>
  <text x="264" y="140" class="mono faint" font-size="9">20</text>
  <rect x="330" y="64" width="24" height="44" rx="2" class="accent" fill-opacity="0.85"/>
  <text x="330" y="126" class="mono faint" font-size="10">6</text>
  <text x="330" y="140" class="mono faint" font-size="9">24</text>
  <rect x="400" y="64" width="32" height="44" rx="2" class="accent" fill-opacity="0.85"/>
  <text x="400" y="126" class="mono faint" font-size="10">8</text>
  <text x="400" y="140" class="mono faint" font-size="9">32</text>
  <rect x="478" y="64" width="48" height="44" rx="2" class="accent" fill-opacity="0.85"/>
  <text x="478" y="126" class="mono faint" font-size="10">10</text>
  <text x="478" y="140" class="mono faint" font-size="9">48</text>
