  <text x="572" y="140" class="mono faint" font-size="9">64</text>
  <text x="40" y="196" class="slate faint" font-size="11">RADIUS — FROM A CHIP TO A SHEET</text>
  <rect x="40" y="212" width="64" height="64" rx="4" class="fill-surface hair"/>
